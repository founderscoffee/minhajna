<!doctype html>
<!-- Screen Handover of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Handover package</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#FAF7F1}.tg{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:start;cursor:pointer}.tg+.tg{border-top:1px solid var(--line)}.tg .x{flex:1;display:flex;flex-direction:column}</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 800px;">
  <div class="bar">
    <a class="ib" href="Settings.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>حزمة التسليم</b><small>لمن يعوّض، أو لأستاذ قادم</small></div>
  </div>

  <div class="form" style="gap: 12px;">
    <div class="sub">مرتّبة حسب الموضوع، ويعيد تطبيق المستلم حساب الوتيرة من آخر إدخال.</div>

    <div class="fl">
      <div class="lab">الأقسام</div>
      <div class="chips">
        <button class="chip on" type="button" aria-pressed="true">4م1</button>
        <button class="chip on" type="button" aria-pressed="true">4م2</button>
        <button class="chip on" type="button" aria-pressed="true">4م3</button>
      </div>
    </div>

    <div class="fl" style="gap: 0px;">
      <div class="lab">في الحزمة دائماً</div>
      <div class="kept"><svg class="i s" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>موقع كل قسم في المخطط</div>
      <div class="kept"><svg class="i s" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>سجل الدفتر اليومي</div>
      <div class="kept"><svg class="i s" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>المورد التالي لكل قسم</div>
    </div>

    <div class="fl">
      <div class="lab">باختياري</div>
      <div class="card" style="padding: 2px 14px; gap: 0px;">
        <button class="tg" type="button" role="switch" aria-checked="false"><span class="x"><span class="t">قوائم التلاميذ</span><span class="c">بالنقل المباشر وحده</span></span><span class="sw "></span></button>
        <button class="tg" type="button" role="switch" aria-checked="false"><span class="x"><span class="t">النقاط</span><span class="c">بالنقل المباشر وحده</span></span><span class="sw "></span></button>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="btn primary" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h3v3"></path></svg>نقل مباشر برمز QR</button>
    <button class="btn line" type="button">ملف مشفّر</button>
    <div class="warn"><svg class="i s" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"></path><path d="M8.8 12.2l2.2 2.2 4.2-4.4"></path></svg><span>موقّعة بمفتاحك: يتحقق المستلم أنها لم تتغيّر وأنها منك. وليس توقيعاً قانونياً في وضع الأستاذ.</span></div>
  </div></div></div></div>



</body></html>
