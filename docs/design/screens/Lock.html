<!doctype html>
<!-- Screen Lock of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>App lock</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>
body{margin:0;background:#FAF7F1}
.lk{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:72px 28px 28px;background-color:var(--board);background-image:radial-gradient(rgba(246,243,234,.05) 1px,transparent 1.2px);background-size:7px 7px;color:var(--chalk)}
.pins{display:flex;gap:14px;direction:ltr}
.pins i{width:14px;height:14px;border-radius:7px;border:2px solid rgba(246,243,234,.7)}
.pins i.on{background:var(--chalk);border-color:var(--chalk)}
.kp{display:grid;grid-template-columns:repeat(3,72px);gap:12px 22px;direction:ltr;margin-top:6px}
.kp button{width:72px;height:72px;border-radius:36px;border:1.5px solid rgba(246,243,234,.22);background:none;color:var(--chalk);font:500 26px/1 "Noto Sans",sans-serif;cursor:pointer}
.kp button.ghost{border:0;font-size:15px}
</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 800px;">
  <div class="lk" style="padding-top: 40px;">
    <svg viewBox="140 84 256 344" width="33" height="44" aria-hidden="true" style="margin-bottom: -8px;"><path d="M334 100C361 100 378 117 376 141C374 163 355 177 330 179C298 181 264 194 238 206C220 214 212 224 211 242C210 302 207 358 201 407C200 413 193 413 192 407C178 352 160 296 159 234C158 188 176 160 212 152C250 144 278 126 299 110C309 103 321 100 334 100Z" style="fill: var(--chalk);"></path></svg>
    <div class="brand" style="font-size: 44px;">منهاجنا</div>
    <div style="font-size: 15px; opacity: 0.85;">الرمز، أو البصمة</div>
    <div class="pins"><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div>
    
      <div class="kp">
        <button class="" type="button" aria-label="1">1</button><button class="" type="button" aria-label="2">2</button><button class="" type="button" aria-label="3">3</button><button class="" type="button" aria-label="4">4</button><button class="" type="button" aria-label="5">5</button><button class="" type="button" aria-label="6">6</button><button class="" type="button" aria-label="7">7</button><button class="" type="button" aria-label="8">8</button><button class="" type="button" aria-label="9">9</button><button class="ghost" type="button" aria-label="فتح بالبصمة">البصمة</button><button class="" type="button" aria-label="0">0</button><button class="ghost" type="button" aria-label="مسح">مسح</button>
      </div>
    
    
    <div style="margin-top: auto; font-size: 12.5px; line-height: 1.6; text-align: center; opacity: 0.75;">يُقفَل التطبيق بعد 5 دقائق دون استعمال. ولا يحفظ بصمة ولا صورة وجه، بل يطلبهما من الهاتف.</div>
  </div></div></div></div>



</body></html>
