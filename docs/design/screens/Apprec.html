<!doctype html>
<!-- Screen Apprec of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Appreciations</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#FAF7F1}.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--board)}.inked{border:1.5px solid var(--board);border-radius:12px;padding:4px 12px 6px;line-height:26px}.flag{font-size:13px;font-weight:600;line-height:1.5;color:#8A3B12}.src{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;line-height:1.55;color:var(--ink2)}.src svg{margin-top:2px}.seg button{line-height:1.3}</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 860px;">
  <div class="bar">
    <a class="ib" href="Marks.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>التقديرات · 4م2</b><small>الفصل الأول · 24 من 36 مختارة</small></div>
  </div>
  <div style="flex: 0 0 auto; padding: 0px 16px 8px;"><div class="prog"><i style="width: 67%;"></i></div></div>

  
    <div class="form" style="gap: 10px; padding-top: 0px;">
      <div class="fl" style="gap: 6px;">
        <div class="lab">اقتراح العبارة حسب</div>
        <div class="seg">
          <button class="on" type="button" aria-pressed="true">المعدل وحده</button>
          <button class="" type="button" aria-pressed="false">المعدل والسلوك والمواظبة</button>
        </div>
        
      </div>

      <div class="card focus">
        <div class="meta"><span class="lat" style="font-weight: 600;">12</span><span class="t" style="flex-grow: 1; font-weight: 700; color: rgb(29, 34, 37);">زروقي محمد أمين</span><span class="badge">المعدل 10.71</span></div>
        
          <div class="prop"><div class="tag">مقترح حسب المعدل</div><div>نتائج مقبولة، يمكنك التحسن</div></div>
          
          <div class="src"><svg class="i s" viewBox="0 0 24 24"><path d="M8 6.5h11M8 12h11M8 17.5h11M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5"></path></svg><span>قائمة مؤقتة يحرّرها «منهاجنا»، في انتظار قائمة المنشور 244 · الإصدار <span class="lat">2026.1</span></span></div>
          <button class="btn primary" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>تأكيد المقترح</button>
        
        
      </div>

      <div class="fl">
        <div class="lab">عبارات أخرى من القائمة</div>
        
          <button class="opt" type="button" style="min-height: 48px;"><span class="t">عمل مقبول، ضاعف الجهد</span></button>
        
          <button class="opt" type="button" style="min-height: 48px;"><span class="t">نتائج متوسطة، تحتاج إلى مثابرة</span></button>
        
      </div>

      <div class="fl">
        <div style="display: flex; gap: 8px;">
          <input class="inp" type="text" placeholder="كتابة عبارة أخرى" value="" style="flex-grow: 1;">
          <button class="btn line" type="button">استعمال</button>
        </div>
        
      </div>

      <div class="sub">لا تعبئة جماعية: تُختار العبارة لكل تلميذ على حدة.</div>
    </div>
    <div class="foot">
      <div class="btns">
        <button class="btn line" type="button">السابق</button>
        <button class="btn line" type="button">التالي</button>
      </div>
    </div>
  

  </div></div></div>



</body></html>
