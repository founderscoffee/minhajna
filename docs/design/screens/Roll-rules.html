<!doctype html>
<!-- Screen Roll-rules of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Counting rules</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#FAF7F1}.rule{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;border:0;background:none;padding:8px 0;text-align:start;font:inherit;color:inherit;cursor:pointer}.rule+.rule{border-top:1px solid var(--line)}.rule .x,.rowlink .x{flex:1;min-width:0;display:flex;flex-direction:column}</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 800px;">
  <div class="bar">
    <a class="ib" href="Month.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>قواعد العدّ</b><small>دفتر المناداة · كل الأقسام</small></div>
  </div>

  <div class="form">
    <div class="sub">لا يحسم نصّ رسمي هذه القواعد، فهي إعدادات. تُعاد الحسابات عند تغييرها، ولا تتغيّر الغيابات المسجّلة.</div>

    <div class="rowlink">
      <span class="x"><span class="t">بداية العدّ</span><span class="c">الإثنين 21 سبتمبر 2026 · الدخول المدرسي</span></span>
      <span class="c" style="font-weight: 600; color: rgb(31, 46, 41);">تغيير</span>
    </div>

    <div class="card" style="padding: 2px 14px; gap: 0px;">
      
        <button class="rule" type="button" role="switch" aria-checked="true">
          <span class="x"><span class="t">العطل المدرسية والأعياد الوطنية</span><span class="c">لا تُحسب ضمن الحضور الممكن</span></span>
          <span class="sw on"></span>
        </button>
      
        <button class="rule" type="button" role="switch" aria-checked="true">
          <span class="x"><span class="t">الأيام الدراسية والندوات التربوية</span><span class="c">لا تُحسب ضمن الحضور الممكن</span></span>
          <span class="sw on"></span>
        </button>
      
        <button class="rule" type="button" role="switch" aria-checked="true">
          <span class="x"><span class="t">الحصص التي لم تُعقد</span><span class="c">لا تُحسب ضمن الحضور الممكن</span></span>
          <span class="sw on"></span>
        </button>
      
        <button class="rule" type="button" role="switch" aria-checked="true">
          <span class="x"><span class="t">يوم بفترة واحدة</span><span class="c">يُحسب نصف يوم</span></span>
          <span class="sw on"></span>
        </button>
      
    </div>

    <div class="priv">
      <div class="lab" style="color: rgb(29, 34, 37);">وحدة العدّ: نصف اليوم</div>
      <div class="c">الغياب صباحاً أو مساءً يُحسب 1، واليوم كاملاً 2. والتأخر لا يُحسب غياباً.</div>
    </div>
  </div>

  <div class="foot">
    <button class="btn line" type="button">استرجاع القيم الأولى</button>
  </div></div></div></div>



</body></html>
