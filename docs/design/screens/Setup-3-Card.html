<!doctype html>
<!-- Screen Setup-3-Card of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Teacher card</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#FAF7F1}</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 800px;">
  <div class="bar">
    <a class="ib" href="Setup-2-Teaching.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>الإعداد</b><small>الخطوة 2 من 5</small></div>
  </div>
  <div class="steps" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>

  <div class="form">
    <div class="fl">
      <div class="h2">بطاقة الأستاذ</div>
      <div class="sub">ما يُطبع في رأس الوثائق. الحقول الشخصية اختيارية، ولا تغادر هذا الهاتف.</div>
    </div>

    <div class="fl">
      <div style="display: flex; align-items: center; gap: 8px;">
        <label class="lab" for="name">الاسم واللقب</label>
        <span class="badge">شخصي · اختياري</span>
      </div>
      <input class="inp" id="name" type="text" value="بن يحيى سعاد">
    </div>

    <div class="fl">
      <label class="lab" for="grade">الرتبة</label>
      <input class="inp" id="grade" type="text" value="أستاذ التعليم المتوسط">
    </div>

    <div class="cols2">
      <div class="fl">
        <label class="lab" for="subject">المادة</label>
        <input class="inp" id="subject" type="text" value="اللغة العربية">
      </div>
      <div class="fl">
        <label class="lab" for="year">السنة الدراسية</label>
        <input class="inp lat" id="year" type="text" value="2026-2027">
      </div>
    </div>

    <div class="fl">
      <label class="lab" for="school">المؤسسة</label>
      <input class="inp" id="school" type="text" value="متوسطة النجاح">
    </div>

    <a class="rowlink" href="Signature.html">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"></path></svg>
      <span class="t">التوقيع المرسوم</span>
      <span class="badge">غير مفعّل</span>
      <svg class="i s flip" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>

  <div class="foot">
    <a class="btn primary" href="Setup-4-Classes.html">التالي</a>
    <a class="btn" href="Setup-4-Classes.html">لاحقاً</a>
  </div></div></div></div>
