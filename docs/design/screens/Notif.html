<!doctype html>
<!-- Screen Notif of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Notifications</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#FAF7F1}.tg{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border:0;background:none;padding:6px 0;font:inherit;color:inherit;text-align:start;cursor:pointer}.tg+.tg{border-top:1px solid var(--line)}.tg .x{flex:1;display:flex;flex-direction:column}.rm{display:flex;align-items:center;gap:12px;min-height:64px;padding:6px 0;color:inherit;text-decoration:none}.rm+.rm{border-top:1px solid var(--line)}.rm .x{flex:1;min-width:0;display:flex;flex-direction:column}.qh{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.6}</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 860px;">
  <div class="bar">
    <a class="ib" href="Settings.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>الإشعارات</b><small>قليلة، وتصل إليك وحدك</small></div>
  </div>

  <div class="form" style="gap: 12px;">
    <div class="card" style="padding: 2px 14px; gap: 0px;">
      
        <button class="tg" type="button" role="switch" aria-checked="true">
          <span class="x"><span class="t">ملخص الأسبوع</span><span class="c">صباح الأحد، لكل قسم</span></span>
          <span class="sw on"></span>
        </button>
      
        <button class="tg" type="button" role="switch" aria-checked="false">
          <span class="x"><span class="t">معاينة يومية</span><span class="c">حصص الغد، قبل ساعات الهدوء</span></span>
          <span class="sw "></span>
        </button>
      
        <button class="tg" type="button" role="switch" aria-checked="false">
          <span class="x"><span class="t">العمل يوم السبت</span><span class="c">يُقصّر هدوء نهاية الأسبوع</span></span>
          <span class="sw "></span>
        </button>
      
    </div>

    <div class="fl">
      <div class="lab">تذكيرات نادرة</div>
      <div class="card" style="padding: 2px 14px; gap: 0px;">
        <button class="tg" type="button" role="switch" aria-checked="true">
          <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
          <span class="x"><span class="t">نهاية السنة: التصدير ثم الإغلاق</span><span class="c">في جوان، ويفتح «نهاية السنة الدراسية»</span></span>
          <span class="sw on"></span>
        </button>
        <button class="tg" type="button" role="switch" aria-checked="true">
          <svg class="i" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5l1-12M10.5 11v6M13.5 11v6"></path></svg>
          <span class="x"><span class="t">مسح بيانات تلاميذ سنة سابقة</span><span class="c">بعد نهاية السنة التي تليها، ويبقى سجل الحصص</span></span>
          <span class="sw on"></span>
        </button>
        <button class="tg" type="button" role="switch" aria-checked="true">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0113.7-5.6M20 4v5h-5M20 12a8 8 0 01-13.7 5.6M4 20v-5h5"></path></svg>
          <span class="x"><span class="t">لا مزامنة ولا نسخة منذ 30 يوماً</span><span class="c">منه: «نسخة الآن» بنقرتين، أو «تذكيري لاحقاً»</span></span>
          <span class="sw on"></span>
        </button>
      </div>
      <div class="c">مشغّلة في الأصل، ويُوقف كل منها وحده. ولا يصل أي منها في ساعات الهدوء.</div>
    </div>

    <div class="card" style="gap: 6px;">
      <div class="t" style="font-weight: 700;">ساعات الهدوء</div>
      <div class="qh">
        <div>كل يوم من 20:00 إلى 07:00</div>
        <div>ومن الخميس 20:00 إلى الأحد 07:00</div>
      </div>
      <div class="c">لا يصل أي إشعار خلالها.</div>
    </div>

    <div class="warn"><svg class="i s" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"></path></svg><span>لا يُظهر أي إشعار اسماً ولا نقطة.</span></div>
  </div></div></div></div>



</body></html>
