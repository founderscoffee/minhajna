<!doctype html>
<!-- Screen Language of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Interface language</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#FAF7F1}.radio{min-height:64px}.radio .x{flex:1;min-width:0;display:flex;flex-direction:column}.radio .c[dir=ltr]{font-family:"Noto Sans",sans-serif;font-size:13px;text-align:end}</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 800px;">
  <div class="bar">
    <a class="ib" href="Settings.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>اللغة</b><small>لغة الواجهة على هذا الهاتف</small></div>
  </div>

  <div class="form" style="gap: 10px;">
    
      <label class="radio on"><input type="radio" name="lang" checked=""><span class="x"><span class="t">العربية</span><span class="c" dir="rtl">اليوم · تأكيد الحصة · الأقسام</span></span></label>
    
      <label class="radio"><input type="radio" name="lang"><span class="x"><span class="t">Français</span><span class="c" dir="ltr">Aujourd’hui · Confirmer la séance · Classes</span></span></label>
    
      <label class="radio"><input type="radio" name="lang"><span class="x"><span class="t">English</span><span class="c" dir="ltr">Today · Confirm the session · Classes</span></span></label>
    

    <div class="priv">
      <div class="t" style="font-size: 14px; font-weight: 600;">الوثائق بلغة المادة دائماً</div>
      <div class="c">دفتر اللغة العربية بالعربية، ودفتر الفرنسية بالفرنسية، مهما كانت لغة الواجهة. والأرقام غربية في اللغات الثلاث.</div>
    </div>
    <div class="c">الواجهة من اليمين إلى اليسار.</div>
  </div>

  <div class="foot">
    <a class="btn primary" href="Settings.html">حفظ</a>
  </div></div></div></div>



</body></html>
