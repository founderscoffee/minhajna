<!doctype html>
<!-- Screen Marks-exam of the Minhajna design canvas, exported as static HTML. All names and entries are made up. -->
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>Entering exam marks</title>

<link rel="stylesheet" href="tb.css">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Noto+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet"><style>
body{margin:0;background:#FAF7F1}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--board)}
.nb{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;background:none;width:100%;font:inherit;color:var(--ink2);text-align:start;cursor:pointer}
.nb .t{flex:1}
.nb .v{font:600 15px/1 "Noto Sans",sans-serif}
.mk{display:flex;align-items:baseline;justify-content:center;gap:6px;font-family:"Noto Sans",sans-serif}
.mk b{font-size:44px;font-weight:700;line-height:1.2;min-width:40px;text-align:center}
.mk span{font-size:18px;color:var(--ink2)}
.pad2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad2 button{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--sheet);font:600 22px/1 "Noto Sans",sans-serif;color:var(--ink);cursor:pointer}
.pad2 button.fr{min-height:44px;font-size:16px;background:#F2EDE3;border-color:#F2EDE3}
.err{font-size:13.5px;font-weight:600;color:#8A3B12;text-align:center}
</style></head>
<body>
<div id="dc-root"><div class="sc-host"><div class="app" dir="rtl" lang="ar" style="width: 360px; height: 800px;">
  <div class="bar">
    <a class="ib" href="Marks.html" aria-label="رجوع"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="ttl"><b>الاختبار · 4م2</b><small>الإثنين 30 نوفمبر · على 20</small></div>
    <span class="c" style="padding-inline-end: 14px;">11 من 36</span>
  </div>
  <div style="flex: 0 0 auto; padding: 0px 16px 8px;"><div class="prog"><i style="width: 31%;"></i></div></div>

  
    <div class="form" style="gap: 8px; padding-top: 0px;">
      <button class="nb" type="button"><span class="n lat" style="width: 22px;">11</span><span class="t">رحماني إكرام</span><span class="v">7</span></button>
      <div class="card focus" style="gap: 2px; padding: 10px 14px;">
        <div class="meta" style="min-height: 24px;"><span class="lat" style="font-weight: 600;">12</span><span class="t" style="font-weight: 700; color: rgb(29, 34, 37);">زروقي محمد أمين</span></div>
        <div class="mk" dir="ltr"><b>—</b><span>/ 20</span></div>
        
      </div>
      <div class="nb"><span class="n lat" style="width: 22px;">13</span><span class="t">سعيدي رتاج</span><span class="v">—</span></div>

      <div class="pad2" dir="ltr" style="margin-top: auto;">
        <button class="fr" type="button">.25</button><button class="fr" type="button">.5</button><button class="fr" type="button">.75</button>
        <button type="button" aria-label="7">7</button><button type="button" aria-label="8">8</button><button type="button" aria-label="9">9</button><button type="button" aria-label="4">4</button><button type="button" aria-label="5">5</button><button type="button" aria-label="6">6</button><button type="button" aria-label="1">1</button><button type="button" aria-label="2">2</button><button type="button" aria-label="3">3</button><button type="button" aria-label=".">.</button><button type="button" aria-label="0">0</button><button type="button" aria-label="مسح">⌫</button>
      </div>
      <div class="btns">
        <button class="btn line" type="button">غائب عن الاختبار</button>
        <button class="btn primary" type="button" style="min-height: 52px; font-size: 16px;">التالي</button>
      </div>
    </div>
  

  </div></div></div>



</body></html>
