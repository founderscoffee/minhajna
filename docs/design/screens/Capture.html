.tile .n{position:absolute;top:5px;inset-inline-end:8px;font:500 11px/1 "Noto Sans",sans-serif;color:var(--pencil)}
.tile.on{border-color:var(--board);background:#EEF1EC}
.tile .val{font:700 12.5px/1.5 "Noto Naskh Arabic","Noto Sans",serif;color:var(--board)}
