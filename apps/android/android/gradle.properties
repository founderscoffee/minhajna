# Memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true

# The ABIs of the phones teachers use. x86 and x86_64 run only in emulators;
# add them for one build with -PreactNativeArchitectures=x86_64.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# React Native's new architecture, and the Hermes engine.
newArchEnabled=true
hermesEnabled=true

# The app draws behind the system bars and pads its screens itself.
edgeToEdgeEnabled=true

# Opt out of the built-in Kotlin and the new DSL of AGP 9, as React Native's
# template does until AGP 10.
android.builtInKotlin=false
android.newDsl=false
