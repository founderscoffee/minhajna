apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "dz.minhajna.preview"
    defaultConfig {
        // Provisional, for the field check: the final ID follows the
        // project's domain, before the first public release.
        applicationId "dz.minhajna.preview"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.0"

        externalNativeBuild {
            cmake {
                // The checkout, the Gradle cache and the SDK lie at different
                // paths on each machine, and the native libraries keep the
                // paths they were compiled from, in their build IDs too.
                // Mapped to fixed names, they are the same everywhere. The
                // compile directory's name holds a hash of those paths, so it
                // becomes "." too. A path with a space cannot pass through
                // CMake's flags, so it stays as it is, and that build is not
                // reproducible.
                def flags = ["-ffile-compilation-dir=."]
                [
                    (rootProject.projectDir.parentFile): "/app",
                    (gradle.gradleUserHomeDir): "/gradle",
                    (android.sdkDirectory): "/sdk",
                ].each { dir, name ->
                    // On macOS, CMake may write /private/tmp as /tmp.
                    def paths = [dir.absolutePath, dir.canonicalPath]
                    paths += paths.findAll { it.startsWith("/private/") }*.substring("/private".length())
                    paths.unique().findAll { !(it =~ /\s/) }.each { flags << "-ffile-prefix-map=${it}=${name}" }
                }
                cFlags(*flags)
                cppFlags(*flags)
            }
        }
    }

    buildTypes {
        release {
            // Unsigned, so that two builds compare byte for byte. The
            // field-check build signs it with a key kept out of the
            // repository, and F-Droid signs its own build.
            signingConfig null
            // The same APK whether or not it is built from a Git checkout.
            vcsInfo.include = false
        }
    }

    dependenciesInfo {
        // The dependency block Google Play asks for is encrypted for Google
        // alone, and F-Droid refuses an APK that carries it.
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
