# Updates arrive as pull requests and are reviewed like any other change
# (docs/contributing/engineering.md#dependencies). Minor and patch updates
# come grouped, one pull request per ecosystem; major ones come one by one.
# Security updates come on their own, from the repository's settings.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories: [/, /apps/android]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
