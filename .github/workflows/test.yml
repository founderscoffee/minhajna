# The build, the type checks, the linter and the tests
# (docs/contributing/workflow.md#pull-requests).

name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node.js 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No dependency cache: the install is small, and a cache would be
          # one more service to call and to trust.
          package-manager-cache: false

      # .npmrc stops install scripts. --no-audit keeps npm from sending the
      # dependency tree to the registry: the dependency review checks
      # vulnerabilities instead.
      - name: Install the locked dependencies
        run: npm ci --no-audit

      # The build and the linter run once the project has those scripts.
      - name: Build
        run: npm run build --if-present

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test
