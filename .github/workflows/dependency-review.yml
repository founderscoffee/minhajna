# The licences and known vulnerabilities of the dependencies a pull request
# adds or changes (docs/contributing/engineering.md#dependencies).

name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Licences and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review the changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Any known vulnerability fails, in development tools too.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # The allowed licences in engineering.md. Any other licence fails,
          # so that a maintainer decides, as engineering.md asks.
          allow-licenses: >-
            MIT, ISC, 0BSD, Zlib, BSD-2-Clause, BSD-3-Clause, Apache-2.0,
            MPL-2.0, LGPL-2.1-or-later, LGPL-3.0-or-later, GPL-3.0-or-later,
            AGPL-3.0-or-later, OFL-1.1, CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0
          # Scorecards would mean calls to a third-party service.
          show-openssf-scorecard: false
